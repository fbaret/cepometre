name: Sonde forêts publiques
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B="https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature"
          for L in ONF.FORETS_PUBLIQUES:ONF_FORETS_PUBLIQUES BDTOPO_V3:foret_publique; do
            curl -sS -m 90 "$B&TYPENAMES=$L&RESULTTYPE=hits&BBOX=42.62,-1.80,43.66,0.70,urn:ogc:def:crs:EPSG::4326" -o h.xml
            echo "::notice title=hits-$L::$(head -c 600 h.xml | tr '\n' ' ')"
            curl -sS -m 90 "$B&TYPENAMES=$L&COUNT=3&OUTPUTFORMAT=application/json&BBOX=43.0,-1.15,43.1,-1.0,urn:ogc:def:crs:EPSG::4326" -o g.json
            python3 -c "
          import json;d=json.load(open('g.json'))
          print('::notice title=feat-$L::'+' || '.join(json.dumps(f['properties'],ensure_ascii=False)+' geom='+f['geometry']['type']+' n='+str(len(json.dumps(f['geometry']))) for f in d['features']))" || echo "::notice title=raw-$L::$(head -c 800 g.json)"
          done
