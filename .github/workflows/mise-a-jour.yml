name: Mise à jour du Cèpomètre

# Deux passages par jour : 06 h 40 et 18 h 40, heure de Paris en été (04 h 40 et 16 h 40 UTC),
# plus un passage à chaque modification du code.
on:
  schedule:
    - cron: "40 4 * * *"
    - cron: "40 16 * * *"
    # Rattrapages : GitHub saute parfois des passages planifiés. Ignorés si la météo a moins de 5 h.
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chiffrer l'appli avec le mot de passe
        env:
          CEPO_PASSWORD: ${{ secrets.CEPO_PASSWORD }}
        run: |
          if [ -z "$CEPO_PASSWORD" ]; then echo "Secret CEPO_PASSWORD manquant."; exit 1; fi
          node source/chiffrer.js "$CEPO_PASSWORD" site

      # Météo : seulement lors des passages planifiés (ou à la demande). Une modification du code
      # reprend la dernière météo BRUTE publiée (wx-raw.json), sans consommer le quota d'Open-Meteo.
      # Les corrections par les stations repartent toujours du brut : jamais de double correction.
      - name: Récupérer la météo du 64 et du 65
        env:
          SITE: https://vestra.fr/cepometre/data
          PREV_URL: https://vestra.fr/cepometre/data/wx-raw.json
        run: |
          mkdir -p site/data
          FRESH=0
          if [ "${{ github.event_name }}" = "schedule" ] && curl -fsSL "$SITE/wx-raw.json" -o /tmp/prev.json; then
            AGE=$(node -e 'const d=require("/tmp/prev.json");console.log(Math.round((Date.now()-Date.parse(d.generated))/36e5))')
            echo "Météo publiée il y a $AGE h"; [ "$AGE" -lt 5 ] && FRESH=1
          fi
          if [ "$FRESH" = 1 ]; then
            echo "Passage de rattrapage inutile : météo récente reprise."; cp /tmp/prev.json site/data/wx-raw.json
          elif [ "${{ github.event_name }}" = "push" ] && curl -fsSL "$SITE/wx-raw.json" -o site/data/wx-raw.json; then
            echo "Modification du code : météo brute reprise du dernier passage."
          elif [ "${{ github.event_name }}" = "push" ] && curl -fsSL "$SITE/wx.json" -o site/data/wx-raw.json; then
            echo "Modification du code : pas encore de météo brute publiée, reprise de wx.json."
          else
            node scripts/meteo.mjs site/data/wx-raw.json
          fi
          cp site/data/wx-raw.json site/data/wx.json

      - name: Corriger pluie et températures avec les stations Météo-France
        continue-on-error: true
        run: node scripts/pluvio.mjs site/data/wx.json

      # Forêts et relief : calculés une seule fois, puis repris du cache de GitHub (recalculés si le script change).
      - uses: actions/cache@v4
        id: statique
        with:
          path: static-cache
          key: statique-v1-${{ hashFiles('scripts/statique.py') }}

      # Forêts publiques (ONF) : même principe, cache séparé.
      - uses: actions/cache@v4
        id: publiques
        with:
          path: public-cache
          key: publiques-v1-${{ hashFiles('scripts/publiques.py', 'scripts/statique.py') }}

      - uses: actions/setup-python@v5
        if: steps.statique.outputs.cache-hit != 'true' || steps.publiques.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Précalculer forêts (BD Forêt IGN) et relief (altimétrie IGN)
        if: steps.statique.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -o pipefail
          {
            sudo apt-get install -y -qq p7zip-full > /dev/null
            pip install -q numpy
            mkdir -p bdforet
            for d in D064 D065; do
              n="BDFORET_2-0__SHP_LAMB93_${d}_2014-04-01"
              curl -fsSL --retry 4 --retry-delay 10 -A "cepometre/1.0" -o "bdforet/$d.7z" "https://data.geopf.fr/telechargement/download/BDFORET/$n/$n.7z"
              ls -l "bdforet/$d.7z"
              7z x -y -o"bdforet/$d" "bdforet/$d.7z" > /dev/null
            done
            find bdforet -iname "*.shp" | head
            SHP_DIR=bdforet python scripts/statique.py static-cache
          } 2>&1 | tee statique.log

      - name: Résumé du précalcul
        if: always() && steps.statique.outputs.cache-hit != 'true'
        run: |
          if [ -f statique.log ]; then grep -v "^ *[0-9]* / " statique.log | tail -n 9 | while IFS= read -r l; do echo "::warning title=precalcul::${l:0:400}"; done; fi

      - name: Précalculer les forêts publiques (ONF)
        if: steps.publiques.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -o pipefail
          pip install -q numpy
          python scripts/publiques.py public-cache 2>&1 | tee publiques.log
          tail -n 3 publiques.log | while IFS= read -r l; do echo "::warning title=publiques::${l:0:400}"; done

      - name: Joindre forêts et relief au site
        run: |
          if [ -f static-cache/static.json ]; then cp static-cache/static.json static-cache/static.bin.gz site/data/ && cat static-cache/static.json | head -c 600; echo
          else echo "Grille forêts/relief absente : la carte restera en météo seule."; fi
          if [ -f public-cache/public.json ]; then cp public-cache/public.json public-cache/public.bin.gz site/data/
          else echo "Forêts publiques absentes : le filtre sera indisponible."; fi

      - name: Diagnostic (altitude, forêt, points témoins)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: node scripts/diagnostic.mjs site/data

      - name: Vérifier le dossier de destination (protection de vestra.fr)
        env:
          DIR: ${{ secrets.OVH_FTP_DIR || './www/cepometre/' }}
        run: |
          case "$DIR" in
            */cepometre/) echo "Destination : $DIR" ;;
            *) echo "Refusé : la destination doit se terminer par /cepometre/ (reçu : $DIR)"; exit 1 ;;
          esac

      - name: Envoyer sur OVH en SFTP (vestra.fr/cepometre)
        env:
          HOST: ${{ secrets.OVH_FTP_HOST }}
          USER: ${{ secrets.OVH_FTP_USER }}
          PASS: ${{ secrets.OVH_FTP_PASSWORD }}
          DIR: ${{ secrets.OVH_FTP_DIR || './www/cepometre/' }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          D="${DIR#./}"; D="${D%/}"
          # mirror -R : copie site/ vers le dossier distant ; --delete n'efface que ce qui est DANS ce dossier.
          lftp -u "$USER,$PASS" "sftp://$HOST" -e "set sftp:auto-confirm yes; set net:max-retries 3; mkdir -p -f $D; mirror -R --delete --verbose --parallel=4 site $D; bye"
